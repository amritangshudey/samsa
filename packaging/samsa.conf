# /etc/samsa/samsa.conf: one node of a three-node cluster. Every key is a
# flag of the same name (samsa -h); `samsa doctor -config /etc/samsa/samsa.conf`
# shows what is in use and what is risky.
profile = prod
node-id = 1
data = /var/lib/samsa
listen = 0.0.0.0:9092
advertise = broker1.example.com:9092
peers = 1=broker1.example.com:9092/broker1.example.com:9093,2=broker2.example.com:9092/broker2.example.com:9093,3=broker3.example.com:9092/broker3.example.com:9093
metrics-listen = 127.0.0.1:9100
tls-cert = /etc/samsa/node.pem
tls-key = /etc/samsa/node.key
peer-tls-cert = /etc/samsa/peer.pem
peer-tls-key = /etc/samsa/peer.key
peer-tls-ca = /etc/samsa/ca.pem
sasl-mechanisms = SCRAM-SHA-256
sasl-users = /etc/samsa/users
