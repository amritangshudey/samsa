name: Release

# Pushing a tag such as v0.1.0 builds the binaries and publishes a GitHub
# release with them. The tests run again first, on the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build test
      - run: make sim SEEDS=1000
      - run: make release VERSION=${{ github.ref_name }}
      - run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes dist/samsa-${{ github.ref_name }}-* dist/SHA256SUMS-${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
