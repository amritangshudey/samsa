name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly: the long simulator run below

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both: the real disk layer behaves differently on Linux and macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build test race
      - run: make fuzz

  # Many seeds of the deterministic simulator. A failure prints the seed;
  # `make sim SEED=<n>` replays it anywhere.
  sim:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # for the nightly run's failure report below
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Per push: 3000 seeds (about 35 seeds/s on a 10-core laptop).
      # Nightly: 30000, from a different first seed each night.
      - if: github.event_name != 'schedule'
        run: make sim SEEDS=3000
      - if: github.event_name == 'schedule'
        run: |
          set -o pipefail
          go test ./internal/sim -count=1 -v -timeout 5h -run '^TestSim$' -seeds=30000 -base-seed=$(( $(date +%s) / 86400 * 30000 )) | tee sim.log
      # The nightly run once failed for eight nights unseen (docs/HANDOFF.md,
      # section 6). A failure opens an issue with the failing seeds, or adds
      # them to the one still open.
      - if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(grep -E 'sim_test.go:[0-9]+: (seed [0-9]+|[0-9]+ seeds)' sim.log | sed -E 's/ \(nodes=[^)]*\)//; s/; totals .*//' | cut -c1-1000 | head -50)"
          body="$body

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Replay a seed with \`make sim SEED=<n>\` on the commit the run tested ($GITHUB_SHA)."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Nightly simulator run failed"' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Nightly simulator run failed" --body "$body"
          fi

  # Exhaustive search of three Raft nodes (docs/design/b2-exhaustive.md)
  # at larger bounds, and the shortest counterexample of a mutation.
  exhaustive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Larger bounds than go test's (depth 10); about 4 minutes on 10 cores.
      - run: go test ./internal/raft -count=1 -timeout 60m -run '^TestExhaustive$' -explore-depth 12
      - run: go test ./internal/raft -count=1 -timeout 60m -run '^TestExhaustive$' -explore-depth 12 -explore-crashes 1 -explore-mode classic
      - run: go test ./internal/raft -count=1 -timeout 60m -run '^TestExhaustive$' -explore-depth 12 -explore-drops 1 -explore-mode classic
      - run: go test ./internal/raft -count=1 -v -timeout 60m -run '^TestExhaustiveShortest$' -explore-shortest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # Real Kafka clients against the built binary. A missing client fails the
  # job instead of being skipped.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags: the upgrade test starts from the previous release
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y kcat
      # The previous release, for TestRollingUpgrade (design G7). HEAD^ so
      # that a tagged commit upgrades from the tag before its own.
      - run: |
          prev=$(git describe --tags --abbrev=0 HEAD^)
          git worktree add "$RUNNER_TEMP/prev" "$prev"
          (cd "$RUNNER_TEMP/prev" && go build -o "$RUNNER_TEMP/samsa-prev" ./cmd/samsa)
          echo "SAMSA_OLD_BIN=$RUNNER_TEMP/samsa-prev" >> "$GITHUB_ENV"
          echo "upgrading from $prev"
      - run: SAMSA_REQUIRE_CLIENTS=1 SAMSA_REQUIRE_UPGRADE=1 make integration
