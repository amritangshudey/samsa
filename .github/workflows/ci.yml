name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly: the long simulator run below

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both: the real disk layer behaves differently on Linux and macOS.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build test race
      - run: make fuzz

  # Many seeds of the deterministic simulator. A failure prints the seed;
  # `make sim SEED=<n>` replays it anywhere.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Per push: 3000 seeds (about 35 seeds/s on a 10-core laptop).
      # Nightly: 30000, from a different first seed each night.
      - if: github.event_name != 'schedule'
        run: make sim SEEDS=3000
      - if: github.event_name == 'schedule'
        run: go test ./internal/sim -count=1 -v -timeout 5h -run '^TestSim$' -seeds=30000 -base-seed=$(( $(date +%s) / 86400 * 30000 ))

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # Real Kafka clients against the built binary. A missing client fails the
  # job instead of being skipped.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags: the upgrade test starts from the previous release
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y kcat
      # The previous release, for TestRollingUpgrade (design G7). HEAD^ so
      # that a tagged commit upgrades from the tag before its own.
      - run: |
          prev=$(git describe --tags --abbrev=0 HEAD^)
          git worktree add "$RUNNER_TEMP/prev" "$prev"
          (cd "$RUNNER_TEMP/prev" && go build -o "$RUNNER_TEMP/samsa-prev" ./cmd/samsa)
          echo "SAMSA_OLD_BIN=$RUNNER_TEMP/samsa-prev" >> "$GITHUB_ENV"
          echo "upgrading from $prev"
      - run: SAMSA_REQUIRE_CLIENTS=1 SAMSA_REQUIRE_UPGRADE=1 make integration
